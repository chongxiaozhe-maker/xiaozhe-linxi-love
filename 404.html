<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>哎呀，走丢了</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf4e8; color: #594943; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background-image: radial-gradient(circle at 1px 1px, rgba(111,82,64,.13) 1px, transparent 0); background-size: 19px 19px; }
  .card { width: min(500px, 100%); padding: 48px 34px 40px; border: 1px solid rgba(132,105,90,.14); border-radius: 6px 24px 6px 24px; background: rgba(255,253,249,.9); box-shadow: 0 20px 45px rgba(109,82,67,.13); text-align: center; }
  .heart { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 50%; color: #fffdf9; background: #e88e91; font-family: Georgia, serif; font-size: 38px; transform: rotate(-7deg); }
  h1 { margin: 0; font-family: "Hannotate SC", "STKaiti", "KaiTi", serif; font-size: 42px; }
  p { margin: 12px 0 25px; color: #89756c; font-size: 14px; line-height: 1.8; }
  a { display: inline-block; padding: 10px 20px; border-radius: 999px; color: #fffdf9; background: #e88e91; text-decoration: none; font-size: 13px; letter-spacing: .06em; }
  a:hover { background: #dc7f83; }
</style>
</head>
<body>
  <main class="card">
    <div class="heart">&#9825;</div>
    <h1>哎呀，走丢了</h1>
    <p>这个页面好像躲进云里了。</p>
    <a href="index.html">回到我们的首页</a>
  </main>
</body>
</html>
